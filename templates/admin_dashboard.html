<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-primary">Admin Dashboard</h2>
<a href="/add_notice" class="btn btn-success mb-3">
    Add Notice
</a>
<a href="/add_faq" class="btn btn-info mb-3">
    Add FAQ
</a> 
    <div class="row mt-4">

    <div class="col-md-6">
        <div class="card text-center bg-primary text-white">
            <div class="card-body">
                <h3>{{ total_students }}</h3>
                <p>Total Students</p>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card text-center bg-success text-white">
            <div class="card-body">
                <h3>{{ total_chats }}</h3>
                <p>Total Chats</p>
            </div>
        </div>
    </div>

</div>

    <h4 class="mt-4">Student Chat History</h4>

    <form method="GET" action="/admin_dashboard" class="mb-3">
    <input type="text"
           name="search"
           placeholder="Search Question..."
           class="form-control">
</form>

    <table class="table table-bordered table-hover table-striped mt-3">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Question</th>
                <th>Answer</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        {% for chat in chats %}

        <tr>
            <td>{{ chat.id }}</td>
            <td>{{ chat.question }}</td>
            <td>{{ chat.answer }}</td>
            <td>{{ chat.chat_time }}</td>

<td>
    <a href="/delete_chat/{{ chat.id }}"
       class="btn btn-danger btn-sm"
       onclick="return confirm('Delete this chat?')">
       Delete
    </a>
</td>
        </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/logout" class="btn btn-danger">Logout</a>

</div>

</body>
</html>
