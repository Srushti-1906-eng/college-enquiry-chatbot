<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI College Enquiry Chatbot</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* Prevent the complete webpage from scrolling */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: linear-gradient(to right, #0f4c81, #1e88e5);
            min-height: 100vh;
        }

        /* Main container */
        .page-container {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px;
            box-sizing: border-box;
        }

        /* Chat card */
        .chat-card {
            width: 90%;
            max-width: 900px;

            height: 96vh;
            max-height: 96vh;

            background: #fff;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .3);

            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: #0d6efd;
            color: white;

            padding: 10px;

            text-align: center;

            flex-shrink: 0;
        }

        /* Logo */
        .logo {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: white;
            padding: 4px;
        }

        /* Heading */
        .chat-header h2 {
            font-size: 22px;
            margin: 5px 0;
        }

        .chat-header p {
            margin: 3px 0;
            font-size: 14px;
        }

        /* Chat messages */
        #chat-box {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 15px;

            background: #f8f9fa;

            box-sizing: border-box;
        }

        /* User message */
        .user {
            text-align: right;
            margin: 10px 0;
        }

        .user b {
            background: #0d6efd;
            color: white;

            padding: 8px 12px;

            border-radius: 15px;

            display: inline-block;

            max-width: 80%;
        }

        /* Bot message */
        .bot {
            text-align: left;
            margin: 10px 0;
        }

        .bot b {
            background: #198754;
            color: white;

            padding: 8px 12px;

            border-radius: 15px;

            display: inline-block;

            max-width: 80%;
        }

        /* Footer */
        .chat-footer {
            padding: 10px;

            background: white;

            flex-shrink: 0;
        }

        /* Input */
        #user-input {
            height: 42px;
        }

        /* Send button */
        .btn-send {
            width: 100px;
        }

        /* Bottom buttons */
        .bottom-buttons {
            text-align: center;

            margin-top: 8px;
        }

        .bottom-buttons a {
            margin: 2px;
        }

        /* Scrollbar only inside chat */
        #chat-box::-webkit-scrollbar {
            width: 7px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 10px;
        }

        /* Smaller laptop screens */
        @media (max-height: 700px) {

            .chat-card {
                height: 98vh;
                max-height: 98vh;
            }

            .chat-header {
                padding: 5px;
            }

            .logo {
                width: 45px;
                height: 45px;
            }

            .chat-header h2 {
                font-size: 18px;
                margin: 2px 0;
            }

            .chat-header p {
                font-size: 12px;
                margin: 2px 0;
            }

            #chat-box {
                padding: 10px;
            }

            .chat-footer {
                padding: 7px;
            }

            .bottom-buttons {
                margin-top: 5px;
            }
        }

    </style>

</head>


<body>

<div class="page-container">

    <div class="chat-card">

        <!-- HEADER -->
        <div class="chat-header">

            <img
                src="{{ url_for('static', filename='college_logo.png') }}"
                class="logo"
            >

            <h2>
                🎓 AI College Enquiry Chatbot
            </h2>

            <p>
                Welcome,
                <b>{{ session['student_name'] }}</b>
            </p>

        </div>


        <!-- CHAT AREA -->
        <div id="chat-box">

            <p class="bot">

                <b>🤖 Bot:</b>
                <br>

                Hello! Welcome to the AI College Enquiry Chatbot.
                <br>

                How can I help you today?

            </p>

        </div>


        <!-- FOOTER -->
        <div class="chat-footer">

            <div class="input-group">

                <input
                    type="text"
                    id="user-input"
                    class="form-control"
                    placeholder="Type your question here..."
                >

                <button
                    class="btn btn-primary btn-send"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>


            <div class="bottom-buttons">

                <a
                    href="/logout"
                    class="btn btn-danger btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
