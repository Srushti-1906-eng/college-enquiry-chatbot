<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right,#141E30,#243B55);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .admin-card{
            width:420px;
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 8px 25px rgba(0,0,0,.4);
        }

        .logo{
            width:90px;
            height:90px;
        }

        .btn-admin{
            width:100%;
            border-radius:30px;
        }

        a{
            text-decoration:none;
        }
    </style>

</head>

<body>

<div class="admin-card">

    <div class="text-center">

        <img src="{{ url_for('static', filename='college_logo.png') }}" class="logo">

        <h3 class="mt-3 text-primary">
            👨‍💼 Admin Login
        </h3>

        <p class="text-muted">
            AI College Enquiry Chatbot
        </p>

    </div>

    <form method="POST">

        <div class="mb-3">
            <label>Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                required>
        </div>

        <button class="btn btn-primary btn-admin">
            Login
        </button>

    </form>

    <hr>

    <div class="text-center">

        <a href="/" class="btn btn-secondary">
            🏠 Home
        </a>

    </div>

</div>

</body>
</html>
