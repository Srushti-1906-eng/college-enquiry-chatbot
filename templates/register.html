<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right,#0f4c81,#1e88e5);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-card{
            width:450px;
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 8px 25px rgba(0,0,0,.3);
        }

        .logo{
            width:90px;
            height:90px;
        }

        .btn-register{
            width:100%;
            border-radius:30px;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center">

        <img src="{{ url_for('static', filename='college_logo.png') }}" class="logo">

        <h3 class="mt-3 text-success">
            Student Registration
        </h3>

        <p class="text-muted">
            AI College Enquiry Chatbot
        </p>

    </div>

    <form method="POST">

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter Full Name" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter Email" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="Create Password" required>
        </div>

        <button class="btn btn-success btn-register">
            Register
        </button>

    </form>

    <hr>

    <div class="text-center">

        Already have an account?

        <br><br>

        <a href="/login" class="btn btn-primary">
            Login
        </a>

        <a href="/" class="btn btn-secondary">
            Home
        </a>

    </div>

</div>

</body>
</html>
